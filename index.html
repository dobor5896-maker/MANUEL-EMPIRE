<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>MANUEL EMPIRE</title>
  <style>
    :root { --gold: #b89452; --ink: #24211c; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .brand {
      position: absolute; top: 34px; left: 5.2vw; margin: 0;
      color: var(--ink); font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(18px, 2vw, 25px); font-weight: 600; letter-spacing: .16em; line-height: 1;
    }
    .side-nav {
      position: fixed; left: 5.1vw; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 27px; z-index: 5;
    }
    .nav-link {
      display: grid; place-items: center; width: 42px; height: 42px; padding: 0;
      color: var(--gold); background: transparent; border: 0; border-radius: 0;
      text-decoration: none; transition: color .2s ease, transform .2s ease;
    }
    .nav-link:hover, .nav-link:focus-visible { color: #8e6d32; transform: translateX(3px); outline: none; }
    .nav-link svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 600px) {
      .brand { top: 25px; left: 24px; font-size: 16px; }
      .side-nav { left: 18px; gap: 20px; }
      .nav-link { width: 38px; height: 38px; }
      .nav-link svg { width: 21px; height: 21px; }
    }
  </style>
</head>
<body>
  <header><h1 class="brand">MANUEL EMPIRE</h1></header>
  <nav class="side-nav" aria-label="Main navigation">
    <a class="nav-link" href="#home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/></svg></a>
    <a class="nav-link" href="#about" aria-label="About" title="About"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></a>
    <a class="nav-link" href="#service" aria-label="Service" title="Service"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M4 12h16M10 12v2h4v-2"/></svg></a>
    <a class="nav-link" href="#product" aria-label="Product" title="Product"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <a class="nav-link" href="#cart" aria-label="Cart" title="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></a>
  </nav>
</body>
</html>
